name: SK1 CFB DIAG PUB-T-959 one-way physical Writer delta

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/diag/pub-t-959/**'
      - '.github/workflows/sk1-cfb-diag-pub-t-959.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-diag-pub-t-959
  cancel-in-progress: true

jobs:
  physical-single-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable original Writer and physical parser
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Install pinned physical CFB stream reader
        run: python3 -m pip install --disable-pip-version-check olefile==0.47
      - name: Validate registry and compile original Writer probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 scripts/verify_registry.py
          cp experiments/cfb/diag/pub-t-959/one_way_delete.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_959_one_way.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_959_one_way
          python3 experiments/cfb/diag/pub-t-959/run.py \
            --rar2 source-rar2 --output results-t959 --self-test
      - name: Execute 27 predeclared public SHA cases
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 experiments/cfb/diag/pub-t-959/run.py \
            --rar2 source-rar2 --output results-t959
          result=$?
          set -e
          echo "$result" > result-exit-code.txt
      - name: Independently reject malformed or unsafe public receipts
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/diag/pub-t-959/check_report.py results-t959
      - name: Upload only verified source-safe receipts
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-959-one-way-cfb-physical-source-safe
          path: |
            results-t959/plan.json
            results-t959/records.json
            results-t959/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Require sufficient independent measured sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat result-exit-code.txt)" = 0
