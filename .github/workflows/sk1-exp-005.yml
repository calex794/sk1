name: SK1 EXP-005 Independent Quill growth holdout

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/sk1-exp-005/**'
      - '.github/workflows/sk1-exp-005.yml'

permissions:
  contents: read

concurrency:
  group: sk1-exp-005-main
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Reuse immutable EXP003 and EXP004 Rust probes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          cp experiments/sk1-exp-003/same_offset_growth.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_exp_003_same_offset.rs
          cp experiments/sk1-exp-004/quill_anchor_census.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_exp_004_anchor_census.rs
          cargo build --quiet --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_exp_003_same_offset --example sk1_exp_004_anchor_census
      - name: Run independent public SHA-pinned holdout
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/sk1-exp-005/run.py --rar2 source-rar2 --out exp005-results
          python3 experiments/sk1-exp-005/check_report.py exp005-results/report.json
      - name: Upload source-safe verified receipts
        uses: actions/upload-artifact@v4
        with:
          name: sk1-exp-005-source-safe-holdout
          path: |
            exp005-results/plan.json
            exp005-results/records.json
            exp005-results/report.json
          retention-days: 30
          if-no-files-found: error
