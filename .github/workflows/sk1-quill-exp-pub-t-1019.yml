name: SK1 QUILL EXP PUB-T-1019 26 real PUB / boundary Writer two-step replacement

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/quill/exp/pub-t-1019/**'
      - '.github/workflows/sk1-quill-exp-pub-t-1019.yml'

permissions:
  contents: read

concurrency:
  group: sk1-quill-exp-pub-t-1019
  cancel-in-progress: true

jobs:
  boundary-matrix-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated SK1 experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact original T963 science comparator
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          path: reference-sk1
          persist-credentials: false
      - name: Checkout pinned upstream Reader Editor Writer
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Compile pinned Writer with only new study-specific probe tail
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_registry.py
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 experiments/quill/exp/pub-t-1019/prepare.py \
            --reference reference-sk1 --writer source-rar2
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_1019_boundary_replace
      - name: Execute 26 SHA, 2 Story, 4 position, 2 glyph boundary matrix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 experiments/quill/exp/pub-t-1019/run.py \
            --rar2 source-rar2 --output results-pub-t-1019
          status=$?
          set -e
          echo "$status" > run-status.txt
      - name: Independently verify source-safe research receipts
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/quill/exp/pub-t-1019/check_report.py results-pub-t-1019
      - name: Upload exactly three source-safe JSON receipts
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-1019-boundary-two-stage
          path: |
            results-pub-t-1019/plan.json
            results-pub-t-1019/records.json
            results-pub-t-1019/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Require complete original-source admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat run-status.txt)" = 0
