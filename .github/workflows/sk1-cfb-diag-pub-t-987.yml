name: SK1 CFB DIAG PUB-T-987 625 natural SYID FE-FF census

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/diag/pub-t-987/**'
      - '.github/workflows/sk1-cfb-diag-pub-t-987.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-diag-pub-t-987
  cancel-in-progress: true

jobs:
  natural-syid-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated SK1 registered experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout original immutable 625 PUB corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: 87094c23e2a9eaa2aa9e95d72ec52f72ef109f11
          path: original-lalamu
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout frozen real PUB-T-984 scientific Writer study
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          path: reference-984
          persist-credentials: false

      - name: Checkout frozen PUB-T-963 inverse CFB inspector and validator
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          path: reference-963
          persist-credentials: false

      - name: Checkout frozen T971 source-selection control
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: cd38c8d6a545737f9f99821076340505db5e149c
          path: reference-971
          persist-credentials: false

      - name: Checkout original unchanged Reader and Writer
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Check every source pin, complete 625-tree and compile original Quill/Writer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_registry.py
          test "$(git -C original-lalamu rev-parse HEAD)" = 87094c23e2a9eaa2aa9e95d72ec52f72ef109f11
          test "$(git -C original-lalamu rev-parse HEAD:pub-corpus/corpus/native/unclassified)" = 8146fa9fdd2f577ebe02bc7205a61bb14e20d3e7
          test "$(git -C reference-984 rev-parse HEAD)" = 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          test "$(git -C reference-963 rev-parse HEAD)" = 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          test "$(git -C reference-971 rev-parse HEAD)" = cd38c8d6a545737f9f99821076340505db5e149c
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 -m py_compile \
            experiments/cfb/diag/pub-t-987/run.py \
            experiments/cfb/diag/pub-t-987/check_report.py
          python3 reference-984/experiments/cfb/val/pub-t-984/prepare.py \
            --ref-inverse reference-963 --ref-corpus reference-971
          cp reference-984/experiments/cfb/val/pub-t-984/real_inverse.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_984_inverse_cfb.rs
          cp experiments/cfb/diag/pub-t-987/natural_syid_census.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_987_natural_syid_census.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_984_inverse_cfb \
            --example sk1_pub_t_987_natural_syid_census

      - name: SHA-scan all 625 real originals and test every natural FE-FF candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/diag/pub-t-987/run.py \
            --rar2 source-rar2 \
            --donor original-lalamu \
            --output results-pub-t-987

      - name: Independent all-625 raw source SHA and genuine Writer receipt audit
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/diag/pub-t-987/check_report.py \
            results-pub-t-987 original-lalamu reference-963

      - name: Publish only 3 fully source-safe JSON receipts
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-987-natural-syid-boundary-safe
          path: |
            results-pub-t-987/plan.json
            results-pub-t-987/records.json
            results-pub-t-987/report.json
          if-no-files-found: error
          retention-days: 30
