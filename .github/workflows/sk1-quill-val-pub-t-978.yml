name: SK1 QUILL VAL PUB-T-978 control characters and line separators

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/quill/val/pub-t-978/**'
      - '.github/workflows/sk1-quill-val-pub-t-978.yml'

permissions:
  contents: read

concurrency:
  group: sk1-quill-val-pub-t-978
  cancel-in-progress: true

jobs:
  unicode-control-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated SK1 task
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable T961 scientific witness harness
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 9ca16fa981e9fd516822979491654eb9b0fc9264
          path: reference-t961
          persist-credentials: false
      - name: Checkout pinned Writer without touching original code
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Verify baseline source hashes and generate only new character matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          test "$(git -C reference-t961 rev-parse HEAD)" = 9ca16fa981e9fd516822979491654eb9b0fc9264
          python3 scripts/verify_registry.py
          python3 experiments/quill/val/pub-t-978/prepare.py --reference reference-t961
          python3 -m py_compile experiments/quill/val/pub-t-978/run.py experiments/quill/val/pub-t-978/check_report.py
          cp experiments/quill/val/pub-t-978/unicode_glyph_compare.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_978_unicode.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_978_unicode
      - name: Measure 77 ASCII controls and 539 seven-class Writer outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/quill/val/pub-t-978/run.py \
            --rar2 source-rar2 --output results-pub-t-978
      - name: Independently enforce source-safe schema and full witness census
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/quill/val/pub-t-978/check_report.py results-pub-t-978
      - name: Upload only verified source-safe JSON, never Publisher binaries
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-978-control-characters-source-safe
          path: |
            results-pub-t-978/plan.json
            results-pub-t-978/records.json
            results-pub-t-978/report.json
          if-no-files-found: error
          retention-days: 30
