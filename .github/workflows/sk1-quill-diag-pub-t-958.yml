name: SK1 QUILL DIAG PUB-T-958 FD boundary after delete

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/quill/diag/pub-t-958/**'
      - 'experiments/registry.json'
      - '.github/workflows/sk1-quill-diag-pub-t-958.yml'

permissions:
  contents: read

concurrency:
  group: sk1-quill-diag-pub-t-958
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Validate task and compile read-only FD geometry on immutable Writer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 scripts/verify_registry.py
          cp experiments/quill/diag/pub-t-958/fd_guard.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_958_fd_guard.rs
          cargo build --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_958_fd_guard
      - name: Measure FD geometry before reverse insert and compare actual Writer outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/quill/diag/pub-t-958/run.py \
            --rar2 source-rar2 --output results-pub-t-958
          python3 experiments/quill/diag/pub-t-958/check_report.py \
            results-pub-t-958/report.json
      - name: Publish validated source-safe metadata only
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-958-fd-guard-verified
          path: |
            results-pub-t-958/plan.json
            results-pub-t-958/records.json
            results-pub-t-958/report.json
          retention-days: 30
          if-no-files-found: error
