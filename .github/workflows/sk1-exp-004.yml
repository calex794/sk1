name: SK1 EXP-004 Quill growth guard geometry census

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/sk1-exp-004/**'
      - '.github/workflows/sk1-exp-004.yml'

permissions:
  contents: read

concurrency:
  group: sk1-exp-004-main
  cancel-in-progress: true

jobs:
  protected-anchor-census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Compile read-only census using immutable upstream Quill parser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          cp experiments/sk1-exp-004/quill_anchor_census.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_exp_004_anchor_census.rs
          cargo build --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_exp_004_anchor_census
      - name: Inspect 26 SHA-pinned sources and check EXP-003 labels
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/sk1-exp-004/run.py \
            --rar2 source-rar2 --output exp004-results
          python3 experiments/sk1-exp-004/check_report.py \
            exp004-results/report.json
      - name: Upload only schema-validated source-safe receipts
        uses: actions/upload-artifact@v4
        with:
          name: sk1-exp-004-verified-source-safe
          path: |
            exp004-results/plan.json
            exp004-results/records.json
            exp004-results/report.json
          retention-days: 30
          if-no-files-found: error
