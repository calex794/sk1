name: SK1 task identity registry gate

on:
  push:
    paths:
      - AGENTS.md
      - experiments/**
      - scripts/verify_registry.py
      - scripts/test_verify_registry.py
      - .github/workflows/sk1-registry-gate.yml
  pull_request:
    paths:
      - AGENTS.md
      - experiments/**
      - scripts/verify_registry.py
      - scripts/test_verify_registry.py
      - .github/workflows/sk1-registry-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate mirrored task IDs and observed experiment folders
        run: python3 scripts/verify_registry.py
      - name: Negative controls — duplicate IDs / parked / unregistered code
        run: python3 -m unittest discover -s scripts -p 'test_verify_registry.py' -v
