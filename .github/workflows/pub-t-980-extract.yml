name: PUB-T-980 forum text extraction
on:
  push:
    branches: [sk1/arch-exp-pub-t-980]
    paths:
      - experiments/arch/exp/pub-t-980/extract_posts.py
      - .github/workflows/pub-t-980-extract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate registry
        run: python3 scripts/verify_registry.py
      - name: Synthetic parser controls
        run: python3 experiments/arch/exp/pub-t-980/extract_posts.py --self-test
      - name: Single bounded public source pass
        run: python3 experiments/arch/exp/pub-t-980/extract_posts.py
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-t-980-forum-text-audit
          path: experiment-results/forum_text_audit.json
          if-no-files-found: warn
          retention-days: 30
