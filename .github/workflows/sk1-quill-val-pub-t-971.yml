name: SK1 QUILL VAL PUB-T-971 exact-growth blind external cohort

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/quill/val/pub-t-971/**'
      - '.github/workflows/sk1-quill-val-pub-t-971.yml'

permissions:
  contents: read

concurrency:
  group: sk1-quill-val-pub-t-971
  cancel-in-progress: true

jobs:
  exact-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SK1 new isolated science branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable original Writer and Quill Reader
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Validate SK1 registry and compile fixed upstream inspector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 scripts/verify_registry.py
          python3 -m py_compile \
            experiments/quill/val/pub-t-971/run.py \
            experiments/quill/val/pub-t-971/check_report.py
          cp experiments/quill/val/pub-t-971/exact_growth.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_971_threshold.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_971_threshold
      - name: Static N first, then Writer blinded arms, for all 47 disjoint SHA
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 experiments/quill/val/pub-t-971/run.py \
            --rar2 source-rar2 --output results-t971
          status=$?
          set -e
          echo "$status" > science-exit-code.txt
      - name: Reject inconsistent data and unsafe report fields
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/quill/val/pub-t-971/check_report.py results-t971
      - name: Upload only strictly validated source-safe JSON
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-971-exact-growth-source-safe
          path: |
            results-t971/plan.json
            results-t971/records.json
            results-t971/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Enforce a minimum of ten new real-source adjacent thresholds
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat science-exit-code.txt)" = 0
