name: SK1 CFB EXP PUB-T-993 true Writer 0x3FF to 0x401

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/exp/pub-t-993/**'
      - '.github/workflows/sk1-cfb-exp-pub-t-993.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-exp-pub-t-993
  cancel-in-progress: true

jobs:
  original-high-pub-writer-carry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated registered SK1 experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact original unchanged product Writer and source archive manifest
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false

      - name: Checkout independently verified original high PUB source downloader T992
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: cfcce7f3f9c425210ee28265d4dbdf79bf742dcc
          path: reference-992
          persist-credentials: false

      - name: Checkout original real Writer step inspector and complete CFB audit T984
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          path: reference-984
          persist-credentials: false

      - name: Checkout frozen T963 Writer Editor Reader physical diff controls
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          path: reference-963
          persist-credentials: false

      - name: Checkout pinned T971 scientific parent
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: cd38c8d6a545737f9f99821076340505db5e149c
          path: reference-971
          persist-credentials: false

      - name: Checkout precedent T988 for distinct genuine Writer-derived carry provenance
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 72e64b9c48fc108df656cd0a3be3fa67167d405e
          path: reference-988
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Verify every source and Writer code pin, generate eight-loop Rust example
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_registry.py
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          test "$(git -C reference-992 rev-parse HEAD)" = cfcce7f3f9c425210ee28265d4dbdf79bf742dcc
          test "$(git -C reference-984 rev-parse HEAD)" = 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          test "$(git -C reference-963 rev-parse HEAD)" = 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          test "$(git -C reference-971 rev-parse HEAD)" = cd38c8d6a545737f9f99821076340505db5e149c
          test "$(git -C reference-988 rev-parse HEAD)" = 72e64b9c48fc108df656cd0a3be3fa67167d405e
          python3 -m py_compile \
            experiments/cfb/exp/pub-t-993/prepare.py \
            experiments/cfb/exp/pub-t-993/run.py \
            experiments/cfb/exp/pub-t-993/check_report.py
          python3 experiments/cfb/exp/pub-t-993/prepare.py \
            --ref-984 reference-984 --ref-963 reference-963 --ref-971 reference-971
          cp experiments/cfb/exp/pub-t-993/generated_writer_chain.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_993_writer_chain.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_993_writer_chain

      - name: Authenticate all 13 original PUB bytes and run up to eight true Writer inverse cycles
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/exp/pub-t-993/run.py \
            --rar2 source-rar2 --reference-992 reference-992 \
            --source-stage source-original-pub-bytes-not-exported \
            --output results-pub-t-993

      - name: Independently rehash raw original source and verify all Writer CFB byte receipts
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/exp/pub-t-993/check_report.py \
            results-pub-t-993 source-rar2 reference-992 \
            source-original-pub-bytes-not-exported reference-963

      - name: Upload only three source-safe JSON receipts, no Publisher originals or Writer outputs
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-993-true-writer-high-0400-source-safe
          path: |
            results-pub-t-993/plan.json
            results-pub-t-993/records.json
            results-pub-t-993/report.json
          if-no-files-found: error
          retention-days: 30
