name: SK1 QUILL DIAG PUB-T-954 read-only TOKN Story classifier

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/quill/diag/pub-t-954/**'

permissions:
  contents: read

concurrency:
  group: sk1-quill-diag-pub-t-954
  cancel-in-progress: true

jobs:
  token-structure-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Verify local SK1 registry and immutable upstream provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_registry.py
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
      - name: Compile isolated read-only Quill introspection
        shell: bash
        run: |
          set -euo pipefail
          cp experiments/quill/diag/pub-t-954/read_only_tokn.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_quill_diag_pub_t_954.rs
          cargo build --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_quill_diag_pub_t_954
      - name: Two immutable read-only passes across 13 pre-registered Story
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tokn-t954-results
          python3 experiments/quill/diag/pub-t-954/run.py \
            --rar2 source-rar2 --output tokn-t954-results
          python3 experiments/quill/diag/pub-t-954/check_report.py tokn-t954-results
      - name: Publish only verified source-safe diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: sk1-quill-diag-pub-t-954-source-safe
          path: |
            tokn-t954-results/plan.json
            tokn-t954-results/records.json
            tokn-t954-results/report.json
          retention-days: 30
          if-no-files-found: error
