name: SK1 PUB-T-996 Quill known paragraph property import controls
on:
  push:
    branches: [sk1/quill-exp-pub-t-996]
    paths:
      - experiments/registry.json
      - experiments/quill/exp/pub-t-996/**
      - .github/workflows/sk1-quill-exp-pub-t-996.yml

permissions:
  contents: read

concurrency:
  group: sk1-quill-exp-pub-t-996
  cancel-in-progress: true

jobs:
  known-style-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/verify_registry.py
      - uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 87a6733516ad6ffd1b6b97a3176f359bfeb60ca1
          path: reference-t994
          persist-credentials: false
      - name: Install verified importer environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-draw fonts-liberation >/dev/null
          python3 -m venv .venv-sk1-996
          .venv-sk1-996/bin/pip install --quiet olefile==0.47
      - name: Known 0x13 and 0x04 same-source field controls
        run: |
          .venv-sk1-996/bin/python experiments/quill/exp/pub-t-996/run.py receipt-t996
          .venv-sk1-996/bin/python experiments/quill/exp/pub-t-996/check_report.py receipt-t996/report.json
      - name: Upload only sanitized report JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-996-source-safe
          path: receipt-t996/report.json
          if-no-files-found: warn
          retention-days: 30
