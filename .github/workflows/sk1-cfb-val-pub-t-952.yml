name: SK1 CFB VAL PUB-T-952 logical stream preservation

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/val/pub-t-952/**'
      - '.github/workflows/sk1-cfb-val-pub-t-952.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-val-pub-t-952
  cancel-in-progress: true

jobs:
  cfb-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Compile CFB stream verification against exact upstream Writer/Reader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          cp experiments/cfb/val/pub-t-952/cfb_stream_preservation.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_cfb_val_pub_t_952.rs
          cargo build --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_cfb_val_pub_t_952
          mkdir -p cfb-val-results
          cargo run --quiet --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example cross_fixture_story_probe -- \
            cfb-val-results/old-calibration.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("cfb-val-results/old-calibration.json").read_text())
          assert p["positive_control"]["receipt"]["output_sha256"] == (
              "b9b789f35a34e016faceb27acf50bf0621273a7d612762ecc17c56ca450fe715")
          assert p["positive_control"]["receipt"]["editor_project_replay_byte_equal"]
          PY
      - name: Run 26 SHA-pinned CFB preservation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/val/pub-t-952/run.py \
            --rar2 source-rar2 --output cfb-val-results
          python3 experiments/cfb/val/pub-t-952/check_report.py \
            cfb-val-results/report.json
      - name: Publish only schema-validated source-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: sk1-cfb-val-pub-t-952-source-safe
          path: |
            cfb-val-results/plan.json
            cfb-val-results/records.json
            cfb-val-results/report.json
          retention-days: 30
          if-no-files-found: error
