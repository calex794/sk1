name: SK1 CFB VAL PUB-T-963 inverse whole-file byte residue

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/val/pub-t-963/**'
      - '.github/workflows/sk1-cfb-val-pub-t-963.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-val-pub-t-963
  cancel-in-progress: true

jobs:
  inverse-cfb-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Verify canonical mirror and compile pinned original Writer probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 scripts/verify_registry.py
          cp experiments/cfb/val/pub-t-963/inspect_inverse.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_963_inverse_cfb.rs
          cargo build --release --manifest-path \
            source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_963_inverse_cfb
      - name: Compare semantically restored PUB against original stream and chunk bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/val/pub-t-963/run.py \
            --rar2 source-rar2 --output results-pub-t-963
          python3 experiments/cfb/val/pub-t-963/check_report.py \
            results-pub-t-963
      - name: Upload only complete source-safe Quill stream-diff receipts
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-963-source-safe-cfb-diff
          path: |
            results-pub-t-963/plan.json
            results-pub-t-963/records.json
            results-pub-t-963/report.json
          retention-days: 30
          if-no-files-found: error
