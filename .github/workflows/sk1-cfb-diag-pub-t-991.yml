name: SK1 CFB DIAG PUB-T-991 natural external 27 SYID FE FF

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/cfb/diag/pub-t-991/**'
      - '.github/workflows/sk1-cfb-diag-pub-t-991.yml'

permissions:
  contents: read

concurrency:
  group: sk1-cfb-diag-pub-t-991
  cancel-in-progress: true

jobs:
  original-external-fe-ff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout registered isolated SK1 scientific experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout immutable Apache POI original samples
        uses: actions/checkout@v4
        with:
          repository: apache/poi
          ref: c85c6918858ea279de2c33df70518c105064df41
          path: source-poi
          sparse-checkout: |
            test-data/publisher
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout immutable Aspose original samples
        uses: actions/checkout@v4
        with:
          repository: aspose-pub/Aspose.PUB-for-.NET
          ref: beee619f9a4b7e2c8908e0fa132f4f4650b08975
          path: source-aspose
          sparse-checkout: |
            Examples/Data
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout immutable file-format original candidate
        uses: actions/checkout@v4
        with:
          repository: mmalecot/file-format
          ref: bdc8e1d219af7d42aa1ebb30c902f0c4a12763f4
          path: source-file-format
          sparse-checkout: |
            fixtures/document
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout pinned old 625-SHA corpus for exact exclusion
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: 87094c23e2a9eaa2aa9e95d72ec52f72ef109f11
          path: reference-lalamu-625
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Checkout pinned original T987 source-only Quill census
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: fa714fe958999325649430dad53c10edac42246a
          path: reference-987
          persist-credentials: false

      - name: Checkout pinned already validated T984 real Writer inverse
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          path: reference-984
          persist-credentials: false

      - name: Checkout frozen T963 Reader Writer CFB receipts and controls
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          path: reference-963
          persist-credentials: false

      - name: Checkout frozen T971 source selector
        uses: actions/checkout@v4
        with:
          repository: calex794/sk1
          ref: cd38c8d6a545737f9f99821076340505db5e149c
          path: reference-971
          persist-credentials: false

      - name: Checkout unchanged original Reader Writer and corpus authority
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 703808408fd919e564a90cdc236e81db3c04af8b
          path: source-rar2
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Check every fixed source pin, derive original Quill scanner and Writer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_registry.py
          test "$(git -C source-poi rev-parse HEAD)" = c85c6918858ea279de2c33df70518c105064df41
          test "$(git -C source-poi rev-parse HEAD:test-data/publisher)" = 10300af0b12b49578dfda1b704aef0a84a663914
          test "$(git -C source-aspose rev-parse HEAD)" = beee619f9a4b7e2c8908e0fa132f4f4650b08975
          test "$(git -C source-file-format rev-parse HEAD)" = bdc8e1d219af7d42aa1ebb30c902f0c4a12763f4
          test "$(git -C reference-lalamu-625 rev-parse HEAD)" = 87094c23e2a9eaa2aa9e95d72ec52f72ef109f11
          test "$(git -C reference-lalamu-625 rev-parse HEAD:pub-corpus/corpus/native/unclassified)" = 8146fa9fdd2f577ebe02bc7205a61bb14e20d3e7
          test "$(git -C reference-987 rev-parse HEAD)" = fa714fe958999325649430dad53c10edac42246a
          test "$(git -C reference-984 rev-parse HEAD)" = 14ac75ae0346b3bdbeeada110e1f463dda6cbb27
          test "$(git -C reference-963 rev-parse HEAD)" = 2caeec283312b0865054ae6f5f93fc9ac1c76b9d
          test "$(git -C reference-971 rev-parse HEAD)" = cd38c8d6a545737f9f99821076340505db5e149c
          test "$(git -C source-rar2 rev-parse HEAD)" = 703808408fd919e564a90cdc236e81db3c04af8b
          python3 -m py_compile \
            experiments/cfb/diag/pub-t-991/prepare.py \
            experiments/cfb/diag/pub-t-991/run.py \
            experiments/cfb/diag/pub-t-991/check_report.py
          python3 experiments/cfb/diag/pub-t-991/prepare.py \
            --ref-987 reference-987 \
            --ref-984 reference-984 \
            --ref-963 reference-963 \
            --ref-971 reference-971
          cp experiments/cfb/diag/pub-t-991/derived_census.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_991_external_census.rs
          cp reference-984/experiments/cfb/val/pub-t-984/real_inverse.rs \
            source-rar2/tools/native-pub-candidate-cli/examples/sk1_pub_t_984_inverse_cfb.rs
          cargo build --release --quiet \
            --manifest-path source-rar2/tools/native-pub-candidate-cli/Cargo.toml \
            --example sk1_pub_t_991_external_census \
            --example sk1_pub_t_984_inverse_cfb

      - name: Census all 27 originals and test only true non-625 FE-FF candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/diag/pub-t-991/run.py \
            --poi source-poi --aspose source-aspose \
            --file-format source-file-format \
            --lalamu reference-lalamu-625 --rar2 source-rar2 \
            --reference-987 reference-987 \
            --output results-pub-t-991

      - name: Independently check original bytes, corpus overlap and physical Writer receipts
        id: audited
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cfb/diag/pub-t-991/check_report.py \
            results-pub-t-991 source-poi source-aspose source-file-format \
            reference-lalamu-625 source-rar2 reference-963

      - name: Publish only three source-safe JSON files, never any PUB
        if: steps.audited.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sk1-pub-t-991-original-external-fe-ff-safe
          path: |
            results-pub-t-991/plan.json
            results-pub-t-991/records.json
            results-pub-t-991/report.json
          retention-days: 30
          if-no-files-found: error
